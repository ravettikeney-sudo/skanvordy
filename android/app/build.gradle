plugins { id 'com.android.application' }
android {
    namespace 'by.skanvordy.app'
    compileSdk 35
    defaultConfig {
        applicationId "by.skanvordy.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("HOME") + "/apk/skanvordy.keystore")
            storePassword "skanvordy-store"
            keyAlias "skanvordy"
            keyPassword "skanvordy-store"
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions "dist"
    productFlavors {
        site { dimension "dist"; buildConfigField "boolean", "SELF_UPDATE", "true" }
        store { dimension "dist"; buildConfigField "boolean", "SELF_UPDATE", "false" }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation "com.yandex.android:mobileads:8.6.0"
}
